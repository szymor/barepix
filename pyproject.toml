[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "barepix"
version = "0.1.0"
description = "A lightweight, self-hosted photo and video web gallery"
requires-python = ">=3.8"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "pyyaml>=6.0",
]

[project.scripts]
barepix = "barepix.main:main"

[tool.setuptools.packages.find]
include = ["barepix*"]

[tool.setuptools.package-data]
barepix = ["templates/*.html", "static/*.css", "static/*.js"]
