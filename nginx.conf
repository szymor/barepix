user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    access_log /var/log/nginx/barepix_access.log;
    error_log /var/log/nginx/barepix_error.log;

    # Upstream to barepix
    upstream barepix_backend {
        server 127.0.0.1:8080;
        keepalive 64;
    }

    server {
        listen 80;
        server_name _;

        root /var/www/barepix;
        index index.html;

        # Static assets - served directly by Nginx
        location /static/ {
            alias /path/to/barepix/barepix/static/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # HTML page
        location = / {
            proxy_pass http://barepix_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API endpoints - proxy to backend
        location /api/ {
            proxy_pass http://barepix_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Video streaming support
            proxy_request_buffering off;
            proxy_http_version 1.1;
            chunked_transfer_encoding off;
        }

        # Media files - serve directly with Nginx for performance
        # Uncomment to offload media serving to Nginx
        # location /api/media/ {
        #     # If using try_files with the Python backend:
        #     # try_files $uri @barepix;
        #     proxy_pass http://barepix_backend;
        #     proxy_set_header Host $host;
        #     proxy_request_buffering off;
        #     proxy_http_version 1.1;
        #     chunked_transfer_encoding off;
        #
        #     # For direct Nginx serving (requires known root_dir):
        #     # alias /path/to/my/photos/$1/;
        # }

        # Fallback to backend for everything else
        location @barepix {
            proxy_pass http://barepix_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
